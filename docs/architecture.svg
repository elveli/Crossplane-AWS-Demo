<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 990" width="900" height="990" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Crossplane AWS Demo architecture</title>
  <desc id="desc">Terraform provisions a VPC and an EKS cluster running Crossplane. kubectl applies manifests that Crossplane continuously reconciles into an S3 bucket, an RDS PostgreSQL instance, an IAM role and a DynamoDB table in AWS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
    </marker>
  </defs>

  <!-- Background (keeps the diagram readable in GitHub dark mode) -->
  <rect x="0" y="0" width="900" height="990" fill="#FFFFFF"/>

  <!-- Developer workstation -->
  <rect x="40" y="20" width="820" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="60" y="47" font-size="15" font-weight="600" fill="#334155">Developer workstation</text>
  <rect x="70" y="60" width="340" height="56" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="90" y="84" font-size="14" font-weight="600" fill="#0F172A">(1) terraform apply</text>
  <text x="90" y="104" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">terraform/*.tf</text>
  <rect x="490" y="60" width="340" height="56" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="510" y="84" font-size="14" font-weight="600" fill="#0F172A">(2) make aws-setup</text>
  <text x="510" y="104" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">kubectl apply -f crossplane-manifests/</text>

  <!-- AWS account -->
  <rect x="40" y="170" width="820" height="760" rx="12" fill="#FFFBF5" stroke="#FF9900" stroke-width="2"/>
  <text x="60" y="198" font-size="16" font-weight="700" fill="#B45309">AWS Account (us-east-1)</text>

  <!-- VPC -->
  <rect x="70" y="215" width="760" height="420" rx="10" fill="#FAF5FF" stroke="#8C4FFF" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="90" y="240" font-size="13" font-weight="600" fill="#6B21A8">VPC 10.0.0.0/16 · 3 AZs · public + private subnets · 1 NAT Gateway</text>

  <!-- EKS -->
  <rect x="100" y="255" width="700" height="360" rx="10" fill="#FFF7ED" stroke="#ED7100" stroke-width="1.5"/>
  <text x="120" y="280" font-size="14" font-weight="700" fill="#9A3412">EKS cluster "crossplane-demo-cluster" · Kubernetes 1.31</text>
  <text x="120" y="300" font-size="12" fill="#9A3412">Managed node group: 2–4 × t3 / t3a / t2.medium (Spot)</text>

  <!-- namespace: default -->
  <rect x="130" y="318" width="640" height="92" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="150" y="340" font-size="12" font-weight="600" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">namespace: default</text>
  <rect x="150" y="352" width="270" height="44" rx="6" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="165" y="371" font-size="12" font-weight="600" fill="#0F172A">Secret db-password</text>
  <text x="165" y="388" font-size="11" fill="#475569">RDS master password</text>
  <rect x="440" y="352" width="270" height="44" rx="6" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="455" y="371" font-size="12" font-weight="600" fill="#0F172A">Secret crossplane-demo-db-conn</text>
  <text x="455" y="388" font-size="11" fill="#475569">RDS endpoint · user · password</text>

  <!-- namespace: crossplane-system -->
  <rect x="130" y="425" width="640" height="172" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="150" y="447" font-size="12" font-weight="600" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">namespace: crossplane-system</text>
  <rect x="150" y="460" width="600" height="124" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5"/>
  <text x="170" y="484" font-size="14" font-weight="700" fill="#115E59">Crossplane 1.15 (Helm)</text>
  <g font-size="11.5" fill="#134E4A" text-anchor="middle">
    <rect x="170" y="496" width="125" height="28" rx="14" fill="#CCFBF1" stroke="#14B8A6"/>
    <text x="232" y="514">provider-aws-s3</text>
    <rect x="305" y="496" width="125" height="28" rx="14" fill="#CCFBF1" stroke="#14B8A6"/>
    <text x="367" y="514">provider-aws-rds</text>
    <rect x="440" y="496" width="125" height="28" rx="14" fill="#CCFBF1" stroke="#14B8A6"/>
    <text x="502" y="514">provider-aws-iam</text>
    <rect x="575" y="496" width="160" height="28" rx="14" fill="#CCFBF1" stroke="#14B8A6"/>
    <text x="655" y="514">provider-aws-dynamodb</text>
  </g>
  <rect x="170" y="540" width="210" height="30" rx="6" fill="#FFFFFF" stroke="#14B8A6"/>
  <text x="275" y="560" font-size="12" text-anchor="middle" fill="#134E4A">ProviderConfig "default"</text>
  <rect x="450" y="540" width="180" height="30" rx="6" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="540" y="560" font-size="12" text-anchor="middle" fill="#0F172A">Secret aws-creds</text>
  <line x1="448" y1="555" x2="384" y2="555" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="416" y="549" font-size="10" text-anchor="middle" fill="#475569">reads</text>

  <!-- Secret wiring inside the cluster -->
  <line x1="400" y1="398" x2="400" y2="458" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="408" y="420" font-size="10.5" fill="#475569">reads</text>
  <line x1="575" y1="458" x2="575" y2="400" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-teal)"/>
  <text x="583" y="420" font-size="10.5" fill="#0F766E">writes back</text>

  <!-- Workstation arrows -->
  <line x1="330" y1="116" x2="330" y2="213" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="158" font-size="12" fill="#334155">provisions VPC, EKS, Crossplane</text>
  <line x1="740" y1="116" x2="740" y2="458" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="158" font-size="12" fill="#334155" text-anchor="end">desired state (YAML)</text>

  <!-- Reconcile fan-out -->
  <line x1="450" y1="584" x2="450" y2="680" stroke="#0F766E" stroke-width="2"/>
  <rect x="462" y="648" width="330" height="22" fill="#FFFBF5"/>
  <text x="466" y="663" font-size="12" font-weight="600" fill="#0F766E">continuous reconcile (create · update · fix drift)</text>
  <line x1="170" y1="680" x2="758" y2="680" stroke="#0F766E" stroke-width="2"/>
  <g stroke="#0F766E" stroke-width="2">
    <line x1="170" y1="680" x2="170" y2="708" marker-end="url(#arrow-teal)"/>
    <line x1="366" y1="680" x2="366" y2="708" marker-end="url(#arrow-teal)"/>
    <line x1="562" y1="680" x2="562" y2="708" marker-end="url(#arrow-teal)"/>
    <line x1="758" y1="680" x2="758" y2="708" marker-end="url(#arrow-teal)"/>
  </g>

  <!-- AWS managed resources -->
  <g text-anchor="middle">
    <rect x="85" y="710" width="170" height="110" rx="10" fill="#F7FEE7" stroke="#7AA116" stroke-width="1.5"/>
    <text x="170" y="752" font-size="15" font-weight="700" fill="#3F6212">S3 Bucket</text>
    <text x="170" y="775" font-size="10.5" fill="#4D7C0F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">crossplane-demo-</text>
    <text x="170" y="790" font-size="10.5" fill="#4D7C0F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">bucket-xyz123</text>

    <rect x="281" y="710" width="170" height="110" rx="10" fill="#EFF6FF" stroke="#2E73B8" stroke-width="1.5"/>
    <text x="366" y="752" font-size="15" font-weight="700" fill="#1E3A8A">RDS PostgreSQL 16</text>
    <text x="366" y="775" font-size="11" fill="#1D4ED8">db.t3.micro · 20 GB</text>
    <text x="366" y="790" font-size="11" fill="#1D4ED8">not publicly accessible</text>

    <rect x="477" y="710" width="170" height="110" rx="10" fill="#FFF1F2" stroke="#DD344C" stroke-width="1.5"/>
    <text x="562" y="752" font-size="15" font-weight="700" fill="#9F1239">IAM Role</text>
    <text x="562" y="775" font-size="10.5" fill="#BE123C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">crossplane-demo-role</text>

    <rect x="673" y="710" width="170" height="110" rx="10" fill="#F5F3FF" stroke="#4D27AA" stroke-width="1.5"/>
    <text x="758" y="752" font-size="15" font-weight="700" fill="#3B0764">DynamoDB Table</text>
    <text x="758" y="775" font-size="11" fill="#5B21B6">PAY_PER_REQUEST</text>
    <text x="758" y="790" font-size="10.5" fill="#5B21B6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">crossplane-demo-table</text>
  </g>

  <text x="450" y="860" font-size="12" text-anchor="middle" fill="#78350F">Managed resources live in your AWS account, outside the VPC, and are billed until deleted.</text>
  <text x="450" y="882" font-size="12" text-anchor="middle" fill="#78350F">On the local path, Docker Desktop replaces the VPC and EKS boxes; everything else is identical.</text>

  <!-- Teardown -->
  <text x="40" y="962" font-size="12.5" fill="#334155"><tspan font-weight="700">Teardown:</tspan> make teardown → kubectl delete (managed resources first), then terraform destroy (EKS, VPC, NAT Gateway)</text>
</svg>
