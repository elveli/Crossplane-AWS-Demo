<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Where Crossplane keeps its state</title>
  <desc id="desc">kubectl and the Crossplane CLI query the Kubernetes API, which stores each managed resource in etcd. The object holds the desired config, the AWS external name, the observed AWS state and status conditions. A provider reconciles the object with the real AWS resource. On Docker Desktop etcd can be read directly; on EKS it is managed by AWS. Terraform state in S3 is used only for the EKS platform on Path B.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="660" fill="#FFFFFF"/>
  <text x="30" y="36" font-size="18" font-weight="700" fill="#0F172A">Where Crossplane keeps its state</text>

  <!-- Terminal -->
  <rect x="30" y="60" width="250" height="250" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="48" y="86" font-size="14" font-weight="600" fill="#334155">Your terminal</text>
  <text x="48" y="104" font-size="11" fill="#64748B">talks to the current kubectl context</text>
  <g font-size="11" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="48" y="136">kubectl get &lt;mr&gt; -o yaml</text>
    <text x="48" y="162">kubectl get managed -o json | jq</text>
    <text x="48" y="188">crossplane beta trace &lt;mr&gt;</text>
    <text x="48" y="214">kubectl get managed -o yaml</text>
    <text x="48" y="230">  &gt; backup.yaml</text>
  </g>
  <rect x="46" y="256" width="218" height="38" rx="19" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="155" y="280" font-size="12" font-weight="600" text-anchor="middle" fill="#166534">Identical on Path A and Path B</text>

  <!-- Kubernetes API server -->
  <rect x="320" y="60" width="280" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="460" y="87" font-size="14" font-weight="600" text-anchor="middle" fill="#3730A3">Kubernetes API server</text>
  <line x1="282" y1="82" x2="318" y2="82" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="104" x2="460" y2="134" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- etcd (cylinder) -->
  <path d="M320,150 A140,14 0 0 1 600,150 L600,486 A140,14 0 0 1 320,486 Z" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <ellipse cx="460" cy="150" rx="140" ry="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="460" y="186" font-size="14" font-weight="700" text-anchor="middle" fill="#5B21B6">etcd = the "state file"</text>

  <!-- Managed resource object -->
  <rect x="338" y="198" width="244" height="214" rx="8" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="352" y="218" font-size="12" font-weight="700" fill="#0F172A">Instance crossplane-demo-db</text>
  <text x="352" y="233" font-size="10.5" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">rds.aws.upbound.io/v1beta1</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <rect x="348" y="242" width="224" height="38" rx="5" fill="#EFF6FF"/>
    <text x="356" y="258" fill="#1D4ED8">spec.forProvider</text>
    <rect x="348" y="285" width="224" height="38" rx="5" fill="#FEF3C7"/>
    <text x="356" y="301" fill="#92400E">crossplane.io/external-name</text>
    <rect x="348" y="328" width="224" height="38" rx="5" fill="#ECFDF5"/>
    <text x="356" y="344" fill="#047857">status.atProvider</text>
    <rect x="348" y="371" width="224" height="34" rx="5" fill="#F1F5F9"/>
    <text x="356" y="386" fill="#334155">status.conditions</text>
  </g>
  <g font-size="10.5" fill="#475569">
    <text x="356" y="273">desired config (like a .tf block)</text>
    <text x="356" y="316">annotation: real AWS ID</text>
    <text x="356" y="359">last observed in AWS (ARN, endpoint)</text>
    <text x="356" y="399">Synced / Ready + error message</text>
  </g>

  <!-- Secret -->
  <rect x="338" y="422" width="244" height="50" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="4 3"/>
  <text x="352" y="442" font-size="11.5" font-weight="600" fill="#0F172A">Secret crossplane-demo-db-conn</text>
  <text x="352" y="460" font-size="10.5" fill="#475569">passwords live here, not on the object</text>

  <!-- AWS -->
  <rect x="700" y="60" width="170" height="426" rx="10" fill="#FFFBF5" stroke="#FF9900" stroke-width="2"/>
  <text x="785" y="86" font-size="14" font-weight="700" text-anchor="middle" fill="#B45309">AWS</text>
  <rect x="716" y="250" width="138" height="104" rx="8" fill="#EFF6FF" stroke="#2E73B8" stroke-width="1.5"/>
  <text x="785" y="286" font-size="13" font-weight="700" text-anchor="middle" fill="#1E3A8A">RDS instance</text>
  <text x="785" y="306" font-size="10" text-anchor="middle" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">db-F3PCKWMB...</text>
  <text x="785" y="326" font-size="10.5" text-anchor="middle" fill="#1D4ED8">the real resource</text>

  <!-- Provider reconcile arrows -->
  <text x="644" y="214" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0F766E">provider-aws-rds</text>
  <text x="644" y="228" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0F766E">reconciles</text>
  <path d="M574,262 L714,262" fill="none" stroke="#0F766E" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
  <text x="644" y="254" font-size="10" text-anchor="middle" fill="#0F766E">create / update</text>
  <line x1="574" y1="304" x2="714" y2="304" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="644" y="298" font-size="10" text-anchor="middle" fill="#B45309">links</text>
  <path d="M714,346 L576,346" fill="none" stroke="#0F766E" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
  <text x="644" y="338" font-size="10" text-anchor="middle" fill="#0F766E">observe</text>

  <!-- Path comparison -->
  <rect x="30" y="514" width="270" height="116" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
  <text x="46" y="540" font-size="13" font-weight="700" fill="#075985">Path A · Docker Desktop</text>
  <g font-size="11.5" fill="#0C4A6E">
    <text x="46" y="564">etcd runs as a pod in kube-system</text>
    <text x="46" y="584">raw keys readable with etcdctl</text>
    <text x="46" y="604">(read-only exploration)</text>
  </g>

  <rect x="315" y="514" width="270" height="116" rx="10" fill="#FFF7ED" stroke="#ED7100" stroke-width="1.5"/>
  <text x="331" y="540" font-size="13" font-weight="700" fill="#9A3412">Path B · EKS</text>
  <g font-size="11.5" fill="#7C2D12">
    <text x="331" y="564">etcd is managed and hidden by AWS</text>
    <text x="331" y="584">no direct access: use the</text>
    <text x="331" y="604">Kubernetes API commands above</text>
  </g>

  <rect x="600" y="514" width="270" height="116" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="616" y="540" font-size="13" font-weight="700" fill="#334155">Terraform state · Path B only</text>
  <g font-size="11.5" fill="#334155">
    <text x="616" y="564">S3 backend: prod/terraform.tfstate</text>
    <text x="616" y="584">VPC, EKS, Crossplane Helm release</text>
    <text x="616" y="604">not S3 / RDS / IAM / DynamoDB</text>
  </g>
</svg>
